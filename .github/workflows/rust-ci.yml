name: Rust CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build
        run: cargo build --verbose --workspace --all-features --exclude atlas
      #  - name: Test
      #    run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-features --workspace --exclude atlas -- -D warnings -A dead_code
      - name: Format
        run: cargo fmt --verbose --all --check


  bootloader:
    name: Atlas bootloaders
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build and lint every ECU
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          config = json.loads(Path("atlas/ecus.json").read_text())
          ecus = sorted(config["ecus"])
          if not ecus or any(not re.fullmatch(r"[a-z0-9_-]+", ecu) for ecu in ecus):
              raise SystemExit("Expected ECU names containing lowercase letters, digits, hyphens, or underscores")
          for ecu in ecus:
              print(f"Building atlas for {ecu}", flush=True)
              env = dict(os.environ, BOOTLOADER_ECU=ecu)
              args = ["--release", "--package", "atlas",
                      "--target", "thumbv8m.main-none-eabihf",
                      "--target-dir", f"target/{ecu}-can-bootloader"]
              subprocess.run(["cargo", "build", *args], env=env, check=True)
              subprocess.run(["cargo", "clippy", *args, "--all-features", "--", "-D", "warnings"],
                             env=env, check=True)
          PYTHON
