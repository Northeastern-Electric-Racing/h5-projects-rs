name: Rust CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATLAS_ECUS: bms vcu lightning msb_front msb_back

    steps:
      - name: Clone repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build
        run: |
          cargo build --verbose --workspace --all-features --exclude atlas
          for ecu in $ATLAS_ECUS; do
            echo "::group::Build atlas for $ecu"
            BOOTLOADER_ECU="$ecu" cargo build --release --package atlas \
              --target thumbv8m.main-none-eabihf
            echo "::endgroup::"
          done
      #  - name: Test
      #    run: cargo test --verbose
      - name: Clippy
        run: |
          cargo clippy --all-features --workspace --exclude atlas -- -D warnings -A dead_code
          for ecu in $ATLAS_ECUS; do
            echo "::group::Clippy atlas for $ecu"
            BOOTLOADER_ECU="$ecu" cargo clippy --release --package atlas \
              --target thumbv8m.main-none-eabihf -- -D warnings
            echo "::endgroup::"
          done
      - name: Format
        run: cargo fmt --verbose --all --check
