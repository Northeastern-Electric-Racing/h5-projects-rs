# This config provides three commands for flashing/running:
#
# `cargo run`:           normal probe-rs run, with `defmt_monitor::monitor!()` calls disabled
# `cargo monitor`:       flashes with the defmt-monitor TUI, with `defmt_monitor::monitor!()` calls enabled
# `cargo monitorattach`: same as `cargo monitor`, but attaches to a board that is already running instead
#                        of reflashing it
#
# `cargo monitorattach` still builds, because the TUI needs the ELF to decode defmt frames. Pass it the same
# flags you flashed with (e.g. `--release`), otherwise the decoder gets a different ELF than the one actually
# on the chip and the output will be nonsense.

[alias]
monitor = [
    "run",
    "--config", "env.DEFMT_MONITOR='on'",
    "--config", "target.thumbv8m.main-none-eabihf.runner='./.scripts/run.sh monitor'",
]
monitorattach = [
    "run",
    "--config", "env.DEFMT_MONITOR='on'",
    "--config", "target.thumbv8m.main-none-eabihf.runner='./.scripts/run.sh monitor --attach'",
]
embed2 = "embed --config-file=../Embed.toml"

[env]
DEFMT_LOG = "trace"
DEFMT_RTT_BUFFER_SIZE = "16384"

# turn off DEFMT_MONITOR by default. `cargo monitor` can be used to flash with monitor
DEFMT_MONITOR = "off"
# firmware target
FIRMWARE_CHIP = "STM32H563ZITx"
# console formatting for probe-rs
FIRMWARE_LOG_FORMAT = "{[{L}]%bold} {[{m}:{l}]%35} {s}"

PROBE_RS_EMBED_CONFIG_FILE = { value = "Embed.toml", relative = true }

[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
runner = "./.scripts/run.sh console"
