[workspace]
members = ["msb-fw-2", "shepherd-3", "lightning", "cerberus-3", "atlas", "template-h5"]
resolver = "3"

[workspace.dependencies]
boot-control = { git = "https://github.com/Northeastern-Electric-Racing/firmware-rs.git", rev = "0ddfbfa4b738134bb2ca87dedfa3304f6bcbf383" }
embassy-boot-stm32 = { version = "0.8.0", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "unstable-pac", "time", "time-driver-any", "exti", "stm32h563zi"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["executor-thread", "executor-interrupt", "defmt", "embassy-time-driver", "platform-cortex-m"] }
embassy-time = { version = "0.5.1",  features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt", "time"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }

defmt = "1"
defmt-rtt = {version = "1", features = ["disable-blocking-mode"]}

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-hal = { version = "1" }
embedded-hal-bus = { version = "0.3", features = ["async", "defmt-03"] }
embedded-io = { version = "0.7", features = ["defmt"] }
embedded-io-async = { version = "0.7", features = ["defmt"] }
panic-probe = { version = "1", features = ["print-defmt", "defmt-error"] }
heapless = { version = "0.9", default-features = false }
static_cell = "2.1"
#chrono = { version = "^0.4", default-features = false}
embedded-hal-async = { version = "1" }
embedded-can = {version = "0.4" }
embedded-storage = "0.3.1"
bitfield = "0.19"
bitfield-struct = "0.13"
crc = { version = "3.3", default-features = false }
assign-resources = "0.5.0"
variant_count = "1.2.1"
uom = {
    version = "0.38",
    default-features = false,
    features = ["si", "f32", "autoconvert"]
}

can-handler = { git = "https://github.com/Northeastern-Electric-Racing/firmware-rs.git", branch = "develop" }
cangen = { git = "https://github.com/Northeastern-Electric-Racing/firmware-rs.git", branch = "develop" }
nereth = { git = "https://github.com/Northeastern-Electric-Racing/firmware-rs.git", branch = "develop" }

lsm6dsv16x-ner = { git = "https://github.com/Northeastern-Electric-Racing/firmware-rs.git", branch = "develop"}
can-bootloader-core = { git = "https://github.com/Northeastern-Electric-Racing/firmware-rs.git", rev = "0ddfbfa4b738134bb2ca87dedfa3304f6bcbf383" }

embassy-net = { version = "0.9.1", features = ["udp", "tcp", "medium-ethernet", "ipv4", "icmp-ping-reply", "defmt"] }
rust-mqtt = { version = "0.5",default-features = false, features = ["defmt", "bump", "v5"]}
embassy-ptp-driver = "0.1.0"

[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
correctness = "deny"
perf = "deny"
disallowed_types = "deny"
default_numeric_fallback = "deny"

[patch.crates-io]
embassy-boot = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-boot-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-ptp-driver = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "8935e71155895245a52f888a3d43b83d8ccdd973" }

lis2mdl-rs = { git = "https://github.com/STMicroelectronics/lis2mdl-rs.git", branch = "main" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
incremental = false
codegen-units = 1
# note: debug = true is okay - debuginfo isn't flashed to the device!
debug = true
